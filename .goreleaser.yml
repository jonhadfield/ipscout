version: 2

project_name: ipscout

env:
  - GO111MODULE=on
  - GOPROXY=https://proxy.golang.org
  - CGO_ENABLED=0

before:
  hooks:
    - make clean
    - go mod tidy

builds:
  - id: ipscout
    binary: ipscout
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - '-X github.com/jonhadfield/ipscout/helpers.Version={{ .Version }}_{{ .Date }}_UTC'
      - '-X github.com/jonhadfield/ipscout/helpers.SemVer={{ .Tag }}'

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: ["tar.gz"]
    ids:
      - ipscout
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - license*
      - readme*
      - changelog*
      - none*

checksum:
  name_template: checksums.txt

release:
  github:
    owner: jonhadfield
    name: ipscout
  prerelease: auto
  name_template: "{{ .Tag }}"
  extra_files:
    - glob: ./dist/ipscout_darwin*.zip

snapshot:
  version_template: "{{ .Tag }}-devel"

changelog:
  sort: asc
  filters:
    exclude:
      - README*
      - test
      - ignore

homebrew_casks:
  - name: ipscout
    homepage: https://github.com/jonhadfield/ipscout
    description: >-
      A command line tool for network administrators and security analysts to quickly identify the origin and threat of an IP address.
    repository:
      owner: jonhadfield
      name: homebrew-ipscout
    # the binaries are unsigned, so clear the quarantine attribute on
    # install to avoid Gatekeeper blocking them
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ipscout"]
          end

announce:
  skip: true
