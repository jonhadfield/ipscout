name: Publish image

# Releases are cut locally with `make release`, which pushes the tag. This
# builds the container image for that tag and pushes it to GHCR, so the
# image and the release archives come from the same commit.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and push'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      -
        name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build metadata
        id: meta
        # context values reach the script as environment variables: expanding
        # them into the script itself would let a crafted input run as code
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        # tags here are unprefixed semver (0.16.0, not v0.16.0)
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          # unprefixed semver only: anything else is a mistake, and an image
          # tag may hold only these characters anyway
          if ! printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.+-]+)?$'; then
            echo "refusing to build unexpected tag: $tag"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%Y/%m/%d:%H:%M:%S')" >> "$GITHUB_OUTPUT"
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # the platforms the release archives ship for
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            BUILD_TAG=${{ steps.meta.outputs.tag }}
            BUILD_SHA=${{ steps.meta.outputs.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      -
        name: Check the published image runs
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          got="$(docker run --rm "$IMAGE" Version)"
          echo "$got"
          case "$got" in
            *"$TAG"*) ;;
            *) echo "image does not report tag $TAG"; exit 1 ;;
          esac
