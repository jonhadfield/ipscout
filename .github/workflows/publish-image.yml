name: Publish image

# Releases are cut locally with `make release`, which pushes the tag. This
# builds the container image for that tag and pushes it to GHCR, so the
# image and the release archives come from the same commit.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and push'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      -
        name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build metadata
        id: meta
        # tags here are unprefixed semver (0.16.0, not v0.16.0)
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%Y/%m/%d:%H:%M:%S')" >> "$GITHUB_OUTPUT"
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # the platforms the release archives ship for
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            BUILD_TAG=${{ steps.meta.outputs.tag }}
            BUILD_SHA=${{ steps.meta.outputs.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      -
        name: Check the published image runs
        run: |
          image="ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}"
          got="$(docker run --rm "$image" Version)"
          echo "$got"
          case "$got" in
            *"${{ steps.meta.outputs.tag }}"*) ;;
            *) echo "image does not report tag ${{ steps.meta.outputs.tag }}"; exit 1 ;;
          esac
